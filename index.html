<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="幸田さんの映画ランキング。鑑賞作品を点数順に掲載しています。">
  <title>映画ランキング | KOUDA</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #11100f;
      --panel: #1a1816;
      --panel-hover: #211f1c;
      --text: #f2eee7;
      --muted: #aaa39a;
      --line: #34302b;
      --accent: #e6b85c;
      --accent-dark: #211b11;
      --max-width: 920px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-width: 320px;
      background:
        radial-gradient(circle at 12% -10%, #2c251a 0, transparent 31rem),
        var(--bg);
      color: var(--text);
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
      line-height: 1.7;
    }

    a { color: inherit; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      padding: 22px clamp(20px, 5vw, 56px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .24em;
      text-decoration: none;
    }

    .brand::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      box-shadow: 0 0 18px rgba(230, 184, 92, .6);
    }

    .section-nav {
      display: flex;
      gap: 6px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #171513;
    }

    .section-link {
      min-width: 62px;
      padding: 6px 14px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      transition: background .18s ease, color .18s ease;
    }

    .section-link:hover { color: var(--text); }

    .section-link[aria-current="page"] {
      background: var(--accent);
      color: #17120a;
    }

    main {
      width: min(var(--max-width), calc(100% - 40px));
      margin: 0 auto;
      padding: clamp(60px, 10vw, 110px) 0 100px;
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;
      font-size: clamp(42px, 8vw, 78px);
      font-weight: 500;
      letter-spacing: -.04em;
      line-height: 1.12;
    }

    .intro {
      max-width: 620px;
      margin: 26px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      position: sticky;
      z-index: 10;
      top: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 12px;
      margin: 54px 0 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(17, 16, 15, .9);
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      backdrop-filter: blur(14px);
    }

    .field { position: relative; }

    .field label {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 9px;
      outline: none;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }

    input { padding: 0 16px; }
    select { padding: 0 38px 0 14px; cursor: pointer; }

    input:focus,
    select:focus { border-color: var(--accent); }

    .result-summary {
      margin: 0 4px 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .movie-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .movie {
      display: grid;
      grid-template-columns: 56px 86px minmax(0, 1fr);
      align-items: center;
      min-height: 76px;
      padding: 10px 18px;
      border: 1px solid transparent;
      border-bottom-color: var(--line);
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .movie:hover {
      border-color: var(--line);
      border-radius: 10px;
      background: var(--panel-hover);
      transform: translateY(-1px);
    }

    .position {
      color: #6f6a63;
      font-family: Georgia, serif;
      font-size: 13px;
      font-variant-numeric: tabular-nums;
    }

    .score {
      justify-self: start;
      min-width: 62px;
      padding: 5px 8px;
      border: 1px solid #4e422b;
      border-radius: 999px;
      background: var(--accent-dark);
      color: var(--accent);
      font-family: Georgia, serif;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      font-variant-numeric: tabular-nums;
    }

    .movie-title {
      font-size: 16px;
      font-weight: 600;
      line-height: 1.55;
      text-decoration-color: transparent;
      text-decoration-thickness: 1px;
      text-underline-offset: 5px;
      transition: color .18s ease, text-decoration-color .18s ease;
    }

    .movie-title:hover {
      color: var(--accent);
      text-decoration-color: var(--accent);
    }

    .movie-content {
      display: flex;
      min-width: 0;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .feedback-link {
      flex: none;
      padding: 3px 8px;
      border: 1px solid #45413c;
      border-radius: 999px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      line-height: 1.5;
      text-decoration: none;
      white-space: nowrap;
      transition: border-color .18s ease, color .18s ease;
    }

    .feedback-link:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty {
      padding: 70px 20px;
      color: var(--muted);
      text-align: center;
    }

    footer {
      padding: 34px 20px;
      border-top: 1px solid var(--line);
      color: #77716a;
      font-size: 12px;
      letter-spacing: .12em;
      text-align: center;
    }

    .visitor-counter {
      display: block;
      margin-top: 10px;
      color: #9a938b;
      font-variant-numeric: tabular-nums;
      letter-spacing: .16em;
    }

    @media (max-width: 620px) {
      main { width: min(100% - 24px, var(--max-width)); }
      .controls { grid-template-columns: 1fr; }
      .movie { grid-template-columns: 38px 70px minmax(0, 1fr); padding-inline: 10px; }
      .score { min-width: 58px; font-size: 12px; }
      .movie-title { font-size: 14px; }
      .movie-content { gap: 7px; }
      .feedback-link { padding-inline: 6px; font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition: none !important; }
    }
  </style>

    <h1>映画ランキング</h1>
    <p class="intro">

        <div class="field">
          <label for="minimum-score">最低点</label>
          <select id="minimum-score">

            <option value="90">90点以上</option>
            <option value="80">80点以上</option>
            <option value="70">70点以上</option>
            <option value="60">60点以上</option>
            <option value="50">50点以上</option>
          </select>
        </div>
      </div>
      <p id="result-summary" class="result-summary" aria-live="polite"></p>
      <ol id="movie-list" class="movie-list"></ol>
    </section>
  </main>

  <footer>
    <span>SINCE 2015 · KOUDA</span>
    <span class="visitor-counter">VISITS <span id="visitor-count">14,033</span></span>
  </footer>

    const movies = rawMovies
      .trim()
      .split(/\r?\n/)
      .map((line, index) => {
        const match = line.match(/^(\d+)点[：:]\s*(.+)$/);
        return match ? { score: Number(match[1]), title: match[2], originalIndex: index } : null;
      })
      .filter(Boolean);

    // 現行Wixページに残っていた、幸田本人のX感想投稿。
    const feedbackLinks = {
      '洞窟おじさん': 'https://x.com/Naoki_Kouda/status/2064348422359167422',
      'フォレスト・ガンプ／一期一会': 'https://x.com/Naoki_Kouda/status/1330891510544437251',
      '大病人': 'https://x.com/Naoki_Kouda/status/1947950973768565098',
      '三体': 'https://x.com/Naoki_Kouda/status/1288145524206342144',
      '魔女 The Witch（2018、韓）': 'https://x.com/Naoki_Kouda/status/1398590746609942528',
      'LUCY': 'https://x.com/Naoki_Kouda/status/1288145524206342144',
      '首（2023）': 'https://x.com/Naoki_Kouda/status/1728043497297531070',
      '田園に死す': 'https://x.com/Naoki_Kouda/status/1290298927690874880',
      '凶悪': 'https://x.com/Naoki_Kouda/status/1983190816131789215',
      '女必殺拳（1974、日）': 'https://x.com/Naoki_Kouda/status/1333685317002424321',
      'スノーピアサー': 'https://x.com/Naoki_Kouda/status/1420370163031941130',
      '教祖誕生': 'https://x.com/Naoki_Kouda/status/1933539920305664256'
    };

    const searchInput = document.querySelector('#search');
    const minimumScore = document.querySelector('#minimum-score');
    const movieList = document.querySelector('#movie-list');
    const resultSummary = document.querySelector('#result-summary');

    function normalize(text) {
      return text.normalize('NFKC').toLocaleLowerCase('ja');
    }

    function createMovieItem(movie) {
      const item = document.createElement('li');
      item.className = 'movie';

      const position = document.createElement('span');
      position.className = 'position';
      position.textContent = String(movie.originalIndex + 1).padStart(3, '0');

      const score = document.createElement('span');
      score.className = 'score';
      score.textContent = `${movie.score}点`;

      const title = document.createElement('a');
      title.className = 'movie-title';
      title.href = `https://www.youtube.com/results?search_query=${encodeURIComponent(`${movie.title} 予告編`)}`;
      title.target = '_blank';
      title.rel = 'noreferrer noopener';
      title.textContent = movie.title;
      title.title = 'YouTubeで予告編を検索';

      const content = document.createElement('span');
      content.className = 'movie-content';
      content.append(title);

      const feedbackUrl = feedbackLinks[movie.title];
      if (feedbackUrl) {
        const feedback = document.createElement('a');
        feedback.className = 'feedback-link';
        feedback.href = feedbackUrl;
        feedback.target = '_blank';
        feedback.rel = 'noreferrer noopener';
        feedback.textContent = 'X 感想';
        feedback.setAttribute('aria-label', `${movie.title}のX感想を読む`);
        content.append(feedback);
      }

      item.append(position, score, content);
      return item;
    }

    function render() {
      const query = normalize(searchInput.value.trim());
      const threshold = Number(minimumScore.value);
      const filtered = movies.filter(movie =>
        movie.score >= threshold && normalize(movie.title).includes(query)
      );

      const fragment = document.createDocumentFragment();
      filtered.forEach(movie => fragment.append(createMovieItem(movie)));

      movieList.replaceChildren(fragment);
      resultSummary.textContent = `${filtered.length} / ${movies.length} 作品を表示`;

      if (filtered.length === 0) {
        const empty = document.createElement('li');
        empty.className = 'empty';
        empty.textContent = '条件に一致する作品がありません。';
        movieList.append(empty);
      }
    }

    searchInput.addEventListener('input', render);
    minimumScore.addEventListener('change', render);
    render();
  </script>
